[project]
name = "congestion-pricing-impact"
version = "1.0.0"
description = "Did New York's congestion toll speed up Manhattan? Difference-in-differences on TLC trip records and MTA data."
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
